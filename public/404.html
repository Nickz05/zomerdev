<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Pagina niet gevonden · Zomer Development</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --navy: #0F2338;
        --gold: #FBA728;
        --paper: #ffffff;
        --surface: #F6F8FC;
        --text-muted: #5A6B85;
        --radius: 14px;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: var(--paper);
        color: var(--navy);
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 3rem;
        text-decoration: none;
        color: var(--navy);
      }
      .logo img { width: 36px; height: 36px; }
      .logo span {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .code {
        font-family: 'Inter', monospace;
        font-size: clamp(6rem, 20vw, 10rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--surface);
        position: relative;
        user-select: none;
      }
      .code::after {
        content: '404';
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--navy) 0%, #1E3F63 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      h1 {
        font-family: 'Fraunces', Georgia, serif;
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        font-weight: 700;
        line-height: 1.2;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
        letter-spacing: -0.02em;
      }
      h1 em {
        font-style: italic;
        color: var(--gold);
      }

      p {
        font-size: 1rem;
        color: var(--text-muted);
        max-width: 36ch;
        line-height: 1.6;
        margin-bottom: 2.5rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--navy);
        color: #fff;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius);
        transition: background 0.2s;
      }
      .btn:hover { background: #16314F; }
      .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    </style>
  </head>
  <body>
    <a class="logo" href="/">
      <img src="/favicon.png" alt="Zomer Development logo" />
      <span>Zomer Development</span>
    </a>

    <div class="code" aria-hidden="true">404</div>

    <h1>Pagina <em>niet gevonden.</em></h1>
    <p>Deze pagina bestaat niet (meer). Misschien is er een typfout in het adres, of is de pagina verplaatst.</p>

    <a class="btn" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M5 12l7-7M5 12l7 7"/>
      </svg>
      Terug naar home
    </a>
  </body>
</html>
